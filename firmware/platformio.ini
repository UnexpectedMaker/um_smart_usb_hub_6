;
; Smart USB Hub firmware — PlatformIO build configuration.
;
;   pio run                      build
;   pio run -t upload            build and flash over USB
;   pio run -e ota -t upload     build and flash over WiFi (see [env:ota])
;   pio device monitor           serial console (type 'help')

[platformio]
default_envs = smart_usb_hub

[env]
; pioarduino's ESP32 platform (Arduino core 3.x), pinned so builds are
; reproducible.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = um_pros3
framework = arduino

board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.wait_for_upload_port = false ; not needed for the native USB CDC/JTAG port

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Wire, WiFi, ArduinoOTA, LittleFS and HTTPClient come with the Arduino core
; and must NOT be listed here — the registry has unrelated libraries with the
; same names that break the build.
lib_deps =
	mathieucarbou/ESPAsyncWebServer@^3.6.0
	mathieucarbou/AsyncTCP@^3.3.2
	adafruit/Adafruit NeoPixel@^1.15.5
	robtillaart/DHT20@^0.3.2

; ESPAsyncWebServer also lists its network layers for other chips (Pico W,
; ESP8266). PlatformIO installs them regardless, and they don't compile for
; the ESP32 — keep them out of the build.
lib_ignore =
	AsyncTCP_RP2040W
	ESPAsyncTCP-esphome

build_flags =
	-fexceptions                 ; the JSON library reports parse errors by throwing
	-D ARDUINO_USB_MODE=0        ; TinyUSB console, see the note below
	-D ARDUINO_USB_CDC_ON_BOOT=1 ; serial console on the native USB port

; USB mode. The board definition uses the ESP32-S3's built-in USB serial/JTAG
; port (ARDUINO_USB_MODE=1). On that port the chip resets into its bootloader
; in hardware whenever the host toggles DTR/RTS, so a `pio run -t upload` from
; any other project that picks the hub's port overwrites this firmware, and no
; firmware setting can stop it on the S3. With ARDUINO_USB_MODE=0 the console
; runs on TinyUSB instead: the firmware ignores the reset request, and the hub
; enumerates as 303A:80D3 instead of the 303A:1001 every ESP32-S3/C3/C6 shows
; on its built-in port, so other projects' port autodetect no longer matches
; it. To flash the hub over USB, type `bootloader` in its console first, or
; use OTA. To go back, set ARDUINO_USB_MODE=1 and delete build_unflags.
build_unflags =
	-DARDUINO_USB_MODE=1

[env:smart_usb_hub]
build_flags =
	${env.build_flags}
	-D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_ERROR
	-D BOARD_HAS_PSRAM

; Flash over WiFi instead of USB:   pio run -e ota -t upload
; The hub must already be running this firmware and be on your network.
; If .local names don't resolve on your machine, put the hub's IP here instead.
[env:ota]
extends = env:smart_usb_hub
upload_protocol = espota
upload_port = usb-hub.local
